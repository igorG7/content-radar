<!doctype html>
<!--
  Template de card TEMÁTICO (gancho/efeméride — ex.: matchday) — Avanz Imóveis.
  Variáveis ${...} são substituídas por envsubst a partir de um content .env.
  O rodapé NÃO está aqui de propósito — é composto via ImageMagick (ver README §Chromium gotcha).
  Canvas 1080x1440 (3:4, novo padrão de retrato do feed). Footer composto em y=1290.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1440px;}
  body{font-family:'Inter','Inter Display',sans-serif;background:#0F172A;color:#fff;
    position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;}

  /* geometria de assinatura (painéis angulares navy + acento laranja) */
  .geo1{position:absolute;top:0;right:0;width:560px;height:430px;background:#1B2A48;
    clip-path:polygon(28% 0,100% 0,100% 100%,0 0);opacity:.9;}
  .geo2{position:absolute;top:0;right:0;width:560px;height:360px;background:#0a0f1c;
    clip-path:polygon(55% 0,100% 0,100% 100%);}
  .geo-orange{position:absolute;top:0;right:150px;width:120px;height:300px;background:#F97316;
    clip-path:polygon(60% 0,100% 0,40% 100%,0% 100%);opacity:.95;}

  .content{position:relative;z-index:2;padding:56px 72px 0;}

  header{display:flex;align-items:center;justify-content:space-between;}
  header img{height:84px;width:auto;}
  .pill{font-size:19px;font-weight:600;letter-spacing:3px;text-transform:uppercase;
    color:#0F172A;background:#F97316;padding:11px 20px;border-radius:999px;}

  /* faixa de "matchday" */
  .match{margin-top:60px;background:#1B2A48;border-radius:24px;padding:38px 44px;
    border:1px solid rgba(255,255,255,.06);}
  .match-row{display:flex;align-items:center;justify-content:center;gap:30px;}
  .team{font-size:50px;font-weight:800;letter-spacing:-1px;color:#fff;}
  .vs{flex:0 0 auto;width:74px;height:74px;border-radius:999px;background:#F97316;color:#0F172A;
    font-size:36px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .match-info{margin-top:22px;text-align:center;font-size:20px;font-weight:700;
    letter-spacing:2px;text-transform:uppercase;color:#F97316;}

  main{margin-top:58px;}
  .title{font-size:56px;line-height:1.1;font-weight:800;letter-spacing:-1.5px;color:#fff;max-width:920px;}
  .title b{color:#F97316;}
  .rule{width:96px;height:5px;background:#F97316;border-radius:3px;margin:32px 0;}
  .body{font-size:26px;line-height:1.5;color:#E5E7EB;max-width:880px;}
  .body b{color:#fff;font-weight:700;}
  .cta{margin-top:40px;display:inline-block;font-size:23px;font-weight:700;color:#0F172A;
    background:#F97316;padding:18px 34px;border-radius:999px;}
</style>
</head>
<body>
  <div class="geo1"></div>
  <div class="geo2"></div>
  <div class="geo-orange"></div>

  <div class="content">
    <header>
      <img src="${LOGO_WHITE}" alt="Avanz Imóveis">
      <span class="pill">${PILL}</span>
    </header>

    <div class="match">
      <div class="match-row">
        <span class="team">${MATCH_HOME}</span>
        <span class="vs">×</span>
        <span class="team">${MATCH_AWAY}</span>
      </div>
      <div class="match-info">${MATCH_INFO}</div>
    </div>

    <main>
      <div class="title">${TITLE}</div>
      <div class="rule"></div>
      <div class="body">${BODY}</div>
      <div class="cta">${CTA}</div>
    </main>
  </div>
</body>
</html>
